[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pydantic-gsheets"
description = "A Pydantic integration for Google Sheets"
version = "1.0.0"
authors = [{name = "Youssef Ben hammouda", email = "youssef@benhammouda.ma"}]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "google-api-python-client~=2.178.0",
    "google-auth-oauthlib~=1.2.2",
    "pydantic~=2.11.7"
]


[project.optional-dependencies]
test = [
  "pytest",
  "Faker",
]
docs = [
  "mkdocs-material>=9.6",
]
dev = [
  "pytest",
  
  "mkdocs-material>=9.6",
 
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydantic_gsheets = ["py.typed"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[project.urls]
Homepage = "https://github.com/Youssefbenhammouda/pydantic-gsheets"
Repository = "https://github.com/Youssefbenhammouda/pydantic-gsheets"
Issues = "https://github.com/Youssefbenhammouda/pydantic-gsheets/issues"
Documentation = "https://github.com/Youssefbenhammouda/pydantic-gsheets#readme"